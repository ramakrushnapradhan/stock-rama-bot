name: Cloudflare Worker tests

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/test-cloudflare-worker.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/test-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check cloudflare/worker.mjs
      - name: Run Worker unit tests
        run: node --test cloudflare/worker.test.mjs
