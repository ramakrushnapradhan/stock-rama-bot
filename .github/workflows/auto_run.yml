name: Stock Rama NSE Insider Alerts

on:
  # Run once each NSE trading weekday at 9:30 PM India time (16:00 UTC).
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stock-rama-bot
  cancel-in-progress: false

jobs:
  run-insider-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily NSE insider trading monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MIN_VALUE_INR: "5000000"
          LOOKBACK_DAYS: "7"
          STATE_FILE: alerted_transactions.json
        run: python nse_insider_bot.py

      - name: Save alert deduplication state
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update insider alert state"
          file_pattern: alerted_transactions.json
