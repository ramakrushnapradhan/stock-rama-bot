name: Stock Rama NSE Insider Alerts

on:
  # Once each NSE trading weekday at 9:30 PM India time (16:00 UTC).
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-rama-bot
  cancel-in-progress: false

jobs:
  run-insider-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing strategy unit tests
        run: python -m unittest -v test_swing_strategy.py

      - name: Run daily NSE insider trading monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          APPROVAL_SERVICE_URL: ${{ vars.APPROVAL_SERVICE_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          MIN_VALUE_INR: "500000"
          LOOKBACK_DAYS: "7"
          TRADING_CAPITAL_INR: "10000"
          MIN_TRADE_AMOUNT_INR: "100"
          MAX_TRADE_AMOUNT_INR: "1500"
          RISK_PER_TRADE_PCT: "1.0"
          BACKTEST_COST_BPS: "30"
          SWING_MAX_HOLD_DAYS: "20"
          STATE_FILE: alerted_transactions.json
        run: python nse_insider_bot.py

      - name: Scan NIFTY 500 for independent swing setups
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          APPROVAL_SERVICE_URL: ${{ vars.APPROVAL_SERVICE_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          TRADING_CAPITAL_INR: "10000"
          MIN_TRADE_AMOUNT_INR: "100"
          MAX_TRADE_AMOUNT_INR: "1500"
          RISK_PER_TRADE_PCT: "1.0"
          BACKTEST_COST_BPS: "30"
          SWING_MAX_HOLD_DAYS: "20"
          SCAN_TOP_N: "5"
        run: python market_scanner.py

      - name: Save alert deduplication state
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update insider alert state"
          file_pattern: alerted_transactions.json
